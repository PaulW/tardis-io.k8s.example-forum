# Installer routing for the 'installer' build target.
#
# Included by nginx.conf. The 'production' target replaces this file
# with one that returns 404.
#
# phpBB's installer lives at /install/app.php and takes the page to
# render as a path segment, so /install/index.php has to be rewritten
# to /install/app.php/index.php.
location /install/ {
    try_files $uri $uri/ @rewrite_installapp;
}

location @rewrite_installapp {
    rewrite ^(.*)$ /install/app.php/$1 last;
}
