# Installer routing for the 'production' build target.
#
# The install/ directory is removed from the image, so any request for
# it must fail with 404 rather than fall through to the front
# controller.
#
# This file is the security boundary, and it is the reason the
# production stage deletes install/ rather than relying on nginx to
# hide it. Belt and braces: the directory is gone, and the route is
# gone too.
location /install/ {
    return 404;
}
